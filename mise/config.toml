[tools]
# Runtimes and SDKs
bun = "latest"
node = "lts"
# pnpm은 aqua prebuilt가 Intel Mac에서 실패하여 전 플랫폼 npm 백엔드로 통일
"npm:pnpm" = "latest"
python = "latest"
uv = "latest"
deno = "latest"
erlang = "29"
elixir = { version = "1.20", depends = ["erlang"] }
java = "temurin-25"
go = "latest"
rust = "latest"

# General-purpose CLI tools
# fd·eza·delta·atuin은 arm64/Linux는 prebuilt, Intel Mac은 바로 아래 cargo로 설치(실행 파일명 동일)
sd = "latest"
fd = { version = "latest", os = ["linux", "macos/arm64"] }
"cargo:fd-find" = { version = "latest", os = ["macos/x64"] }
"conda:eza" = { version = "latest", os = ["linux", "macos/arm64"] }
"cargo:eza" = { version = "latest", os = ["macos/x64"] }
bat = "latest"
hyperfine = "latest"
ripgrep = "latest"
delta = { version = "latest", os = ["linux", "macos/arm64"] }
"cargo:git-delta" = { version = "latest", os = ["macos/x64"] }
gdu = "latest"
duf = "latest"
dust = "latest"
gping = "latest"
jq = "latest"
fx = "latest"
zoxide = "latest"
ctop = "latest"
bottom = "latest"
lazygit = "latest"
lazydocker = "latest"
direnv = "latest"
atuin = { version = "latest", os = ["linux", "macos/arm64"] }
"cargo:atuin" = { version = "latest", os = ["macos/x64"] }
gh = "latest"
neovim = "latest"
fzf = "latest"
starship = "latest"
fastfetch = "latest"
curlie = "latest"
"pipx:httpie" = { version = "latest", depends = ["uv"] }
mc = "latest"
tmux = "latest"

# Development and deployment CLI tools
act = "latest"
buf = "latest"
clang-format = "latest"
cmake = "latest"
dive = "latest"
git-lfs = "latest"
goreleaser = "latest"
gradle = "latest"
helm = "latest"
maven = "latest"
"pipx:mercurial" = { version = "latest", depends = ["uv"] }
mkcert = "latest"
terraform = "latest"
wrangler = "latest"

# Agent CLI tools
"npm:agent-browser" = "latest"
claude = "latest"
codex = "latest"
hunk = "latest"
herdr = "latest"

[settings]
minimum_release_age = "0s"

[settings.npm]
package_manager = "bun"
